<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Iniciar sesión</title> </head>
<body> 
    <h1> Iniciar sesión </h1> 
    <form method="POST"> {% csrf_token %} 
    <!-- Django crea automáticamente los campos de usuario y contraseña. --> 
    {{ form.as_p }}
    <button type="submit"> 
        Ingresar 
    </button> 
    </form> 
    <hr> 
    <p> 
        ¿No tienes una cuenta? 
        <a href="{% url 'registro' %}"> 
            Registrarse
        </a>
    </p>
</body> 
</html>
